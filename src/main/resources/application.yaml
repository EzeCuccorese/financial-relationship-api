

# Database configuration
spring:
  datasource:
    url: jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:financial_relationship_db}
    username: ${RDS_USERNAME:financial_relationship_dbuser}
    password: ${RDS_PASSWORD:financial_relationship_dbpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 5000
