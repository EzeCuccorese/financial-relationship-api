# Database configuration
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reba}
    username: ${SPRING_DATASOURCE_USERNAME:rebauser}
    password: ${SPRING_DATASOURCE_PASSWORD:rebapassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        hbm2ddl:
          auto: create
        show_sql: true
      javax:
        persistence:
          schema-generation:
            scripts:
              create-target: "classpath:static/create.sql"
